name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: potassium-mcp/package-lock.json
          registry-url: https://registry.npmjs.org/

      - name: Verify tag and project versions
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        run: |
          $packageVersion = (Get-Content potassium-mcp/package.json -Raw | ConvertFrom-Json).version
          $fileVersion = (Get-Content version.txt -Raw).Trim()
          $expectedTag = "v$packageVersion"
          if ($fileVersion -ne $packageVersion) {
            throw "version.txt ($fileVersion) does not match package.json ($packageVersion)"
          }
          if ("${{ github.ref_name }}" -ne $expectedTag) {
            throw "Tag ${{ github.ref_name }} does not match $expectedTag"
          }

      - name: Install locked dependencies
        run: npm ci --prefix potassium-mcp

      - name: Run tests
        run: npm --prefix potassium-mcp test

      - name: Run release tooling tests
        run: node --test tools/release.test.mjs

      - name: Verify release source
        run: npm --prefix potassium-mcp run release:check

      - name: Pack and inspect npm tarball
        shell: pwsh
        run: |
          $pack = npm --prefix potassium-mcp pack --json | ConvertFrom-Json
          if ($pack.Count -ne 1) { throw "npm pack did not produce exactly one tarball" }
          $tarball = Join-Path $PWD "potassium-mcp/$($pack[0].filename)"
          if (-not (Test-Path -LiteralPath $tarball)) { throw "npm pack tarball was not created" }
          $contents = @(& tar -tf $tarball)
          $required = @(
            "package/package.json",
            "package/README.md",
            "package/LICENSE",
            "package/bin/potassium-mcp.js",
            "package/src/install.js",
            "package/src/deploy.js",
            "package/src/doctor.js",
            "package/src/server.js",
            "package/src/bridge.js",
            "package/src/safe-read.js",
            "package/assets/potassium_mcp_bootstrap.lua",
            "package/assets/potassium_mcp_autoexec.lua"
          )
          $missing = $required | Where-Object { $_ -notin $contents }
          if ($missing) { throw "Tarball is missing required runtime files: $($missing -join ', ')" }
          $forbidden = $contents | Where-Object { $_ -match '^package/(test|docs)/' }
          if ($forbidden) { throw "Tarball contains non-runtime files: $($forbidden -join ', ')" }
          Remove-Item -LiteralPath $tarball -Force

      - name: Publish MCP package to npmjs
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm --prefix potassium-mcp run release:publish

      - name: Build verified GitHub release assets
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: npm --prefix potassium-mcp run release:pack

      - name: Create ZIP and checksum
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        id: assets
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $tag = "${{ github.ref_name }}"
          $archiveName = "potassium-mcp-$tag-windows.zip"
          $archivePath = Join-Path $PWD "release-out/$archiveName"
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            (Join-Path $PWD "release-out/public"),
            $archivePath,
            [System.IO.Compression.CompressionLevel]::Optimal,
            $false
          )
          $checksumName = "$archiveName.sha256"
          $hash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD "release-out/$checksumName"),
            "$hash  $archiveName`n",
            [System.Text.UTF8Encoding]::new($false)
          )
          Copy-Item release-out/public/RELEASE-EVIDENCE.json release-out/RELEASE-EVIDENCE.json
          "archive=$archiveName" >> $env:GITHUB_OUTPUT
          "checksum=$checksumName" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          $arguments = @(
            "release", "create", $tag,
            "release-out/${{ steps.assets.outputs.archive }}",
            "release-out/${{ steps.assets.outputs.checksum }}",
            "release-out/RELEASE-EVIDENCE.json",
            "--verify-tag",
            "--title", "Potassium MCP $version",
            "--generate-notes"
          )
          if ($version.Contains("-")) { $arguments += "--prerelease" }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
